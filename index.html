function isThemeIdValid(id){
  return Object.prototype.hasOwnProperty.call(THEME_PACKS, id);
}

function getActiveTheme(){
  return THEME_PACKS[settings.themeId] || THEME_PACKS[DEFAULT_THEME_ID];
}

function isGameplayModeIdValid(id){
  return Object.prototype.hasOwnProperty.call(GAMEPLAY_MODES, id);
}

function getActiveMode(){
  return GAMEPLAY_MODES[settings.gameplayModeId] || GAMEPLAY_MODES[DEFAULT_GAMEPLAY_MODE_ID];
}

function setGameplayModeId(id){
  if (!isGameplayModeIdValid(id)) return false;
  settings.gameplayModeId = id;
  saveSettings();
  return true;
}

function applyGameplayModeFromMenu(id){
  if (!canApplyMenuSetting()) return false;
  const changed = settings.gameplayModeId !== id;
  const ok = setGameplayModeId(id);
  if (ok && changed){
    // Table layout depends on the mode — rebuild immediately so the new layout
    // is visible as soon as the menu closes, without waiting for game over.
    clearTable();
    buildTable();
    serveBall();
  }
  return ok;
}

function saveSettings(){
  localStorage.setItem(THEME_STORAGE_KEY, settings.themeId);
  localStorage.setItem(SOUND_STORAGE_KEY, String(settings.soundEnabled));
  localStorage.setItem(GAMEPLAY_MODE_STORAGE_KEY, settings.gameplayModeId);
}

function loadSettings(){
  const rawTheme = localStorage.getItem(THEME_STORAGE_KEY);
  const rawSound = localStorage.getItem(SOUND_STORAGE_KEY);
  const rawMode  = localStorage.getItem(GAMEPLAY_MODE_STORAGE_KEY);

  settings.themeId = isThemeIdValid(rawTheme) ? rawTheme : DEFAULT_THEME_ID;
  const soundValid = rawSound === 'true' || rawSound === 'false';
  settings.soundEnabled = soundValid ? rawSound === 'true' : true;
  settings.gameplayModeId = isGameplayModeIdValid(rawMode) ? rawMode : DEFAULT_GAMEPLAY_MODE_ID;

  if (!isThemeIdValid(rawTheme)) localStorage.setItem(THEME_STORAGE_KEY, settings.themeId);
  if (!soundValid) localStorage.setItem(SOUND_STORAGE_KEY, String(settings.soundEnabled));
  if (!isGameplayModeIdValid(rawMode)) localStorage.setItem(GAMEPLAY_MODE_STORAGE_KEY, settings.gameplayModeId);
}

function setThemeId(nextId){
  if (!isThemeIdValid(nextId)) return false;
  settings.themeId = nextId;
  saveSettings();
  return true;
}

function setSoundEnabled(enabled){
  settings.soundEnabled = !!enabled;
  saveSettings();
}

  paused = true;
  menu.open = true;
}

function closeMenuAndResume(){
  menu.open = false;
  paused = false;
}

function canApplyMenuSetting(){
  return menu.open && paused;
}

  if (!canApplyMenuSetting()) return false;

}

// Swept circle (center p0, displacement d=v*dt, radius r) vs static segment [a,b].
// Returns { toi in [0,1], normal } or null. Normal points from segment toward circle.
function sweepCircleSegment(p0, d, r, a, b){
  const sx = b.x-a.x, sy = b.y-a.y;
  const segLen2 = sx*sx + sy*sy;
  if (segLen2 < 1e-6) return null;
  // Segment normal (left-hand)
  let nx = -sy, ny = sx;
  const nl = Math.hypot(nx,ny); nx/=nl; ny/=nl;
  // Ensure normal points toward the moving circle's start
  const side = (p0.x-a.x)*nx + (p0.y-a.y)*ny;
  if (side < 0){ nx=-nx; ny=-ny; }
  // Distance from start center to infinite line along normal
  const dist0 = (p0.x-a.x)*nx + (p0.y-a.y)*ny; // >= 0
  const vN = d.x*nx + d.y*ny; // signed motion along normal (negative = approaching)
  if (vN >= 0) return null;
  const toi = (dist0 - r) / (-vN);
  if (toi > 1) return null;
  // toi may be slightly negative when the ball already overlaps the line of the
  // segment (e.g. it just shaved past an endpoint corner the previous substep).
  // We still need to consider endpoints in that case — otherwise the ball can
  // tunnel through near the corner of a short segment like a slingshot.
  if (toi < 0){
    // If the projected contact point actually lies inside the segment body we
    // treat this as a real overlap and resolve at toi=0 with the line normal.
    const cxOv = p0.x, cyOv = p0.y;
    const tOv = ((cxOv-a.x)*sx + (cyOv-a.y)*sy) / segLen2;
    if (tOv >= 0 && tOv <= 1) return { toi: 0, normal:{x:nx,y:ny} };
    return sweepCircleEnd(p0,d,r,a) ?? sweepCircleEnd(p0,d,r,b);
  }
  // Contact point along segment axis
  const cx = p0.x + d.x*toi, cy = p0.y + d.y*toi;
  const t = ((cx-a.x)*sx + (cy-a.y)*sy) / segLen2;
  if (t < 0 || t > 1){
    // Check endpoints (circle vs point)
    return sweepCircleEnd(p0,d,r,a) ?? sweepCircleEnd(p0,d,r,b);
  }
  return { toi, normal:{x:nx,y:ny} };
}

function sweepCircleEnd(p0, d, r, q){
  // Circle of radius r centered at p0+d*t collides with point q
  const fx = p0.x - q.x, fy = p0.y - q.y;
  const A = d.x*d.x + d.y*d.y;
  const B = 2*(fx*d.x + fy*d.y);
  const C = fx*fx + fy*fy - r*r;
  if (A < 1e-9) return null;
  const disc = B*B - 4*A*C;
  if (disc < 0) return null;
  const t = (-B - Math.sqrt(disc)) / (2*A);
  if (t < 0 || t > 1) return null;
  const cx = p0.x + d.x*t, cy = p0.y + d.y*t;
  let nx = cx - q.x, ny = cy - q.y;
  const nl = Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
  return { toi:t, normal:{x:nx,y:ny} };
}

function sweepCircleArc(p0, d, r, c, R, a0, a1, outward=true){
  // Outward arc (ball outside circle of radius R-r at center c). Treat as circle vs circle.
  const target = outward ? (R + r) : (R - r);
  const fx = p0.x - c.x, fy = p0.y - c.y;
  const A = d.x*d.x + d.y*d.y;
  const B = 2*(fx*d.x + fy*d.y);
  const C = fx*fx + fy*fy - target*target;
  if (A < 1e-9) return null;
  const disc = B*B - 4*A*C;
  if (disc < 0) return null;
  const t = outward
    ? (-B - Math.sqrt(disc)) / (2*A)
    : (-B + Math.sqrt(disc)) / (2*A);
  const dist0 = Math.hypot(fx, fy);
  if (t < 0){
    if (dist0 > target + 1e-6) return null;
    let nx = fx, ny = fy;
    if (dist0 < 1e-6){ nx = 0; ny = -1; }
    else { nx /= dist0; ny /= dist0; }
    if (!outward){ nx = -nx; ny = -ny; }
    return { toi:0, normal:{x:nx,y:ny} };
  }
  if (t > 1) return null;
  const cx = p0.x + d.x*t, cy = p0.y + d.y*t;
  const ang = Math.atan2(cy - c.y, cx - c.x);
  const fullCircle = Math.abs(Math.abs(a1 - a0) - 2*Math.PI) < 1e-6;
  if (fullCircle){
    let nx = (cx - c.x), ny = (cy - c.y);
    const nl = Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
    if (!outward){ nx=-nx; ny=-ny; }
    return { toi:t, normal:{x:nx,y:ny} };
  }
  const norm = a => { a = a % (2*Math.PI); return a < 0 ? a + 2*Math.PI : a; };
  const A0 = norm(a0), A1 = norm(a1), AN = norm(ang);
  const inArc = A0 <= A1 ? (AN >= A0 && AN <= A1) : (AN >= A0 || AN <= A1);
  if (!inArc) return null;
  let nx = (cx - c.x), ny = (cy - c.y);
  const nl = Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
  if (!outward){ nx=-nx; ny=-ny; }
  return { toi:t, normal:{x:nx,y:ny} };
}

// ============ 3. PHYSICS ============
const ball = { p:{x:400, y:680}, v:{x:0, y:0}, r: CONFIG.BALL_R };

const segments = []; // { a, b, restitution, friction, kind, enabled? }
let gateSeg = null;
function addSegment(a, b, opts={}){
  segments.push({ a, b, restitution: opts.restitution ?? 0.55, friction: opts.friction ?? 0.02, kind: opts.kind ?? 'wall' });
}

const arcRegistry = []; // { c, R, a0, a1, outward, restitution }
function addArc(c, R, a0, a1, opts={}){
  arcRegistry.push({ c, R, a0, a1, outward: opts.outward ?? false, restitution: opts.restitution ?? 0.55 });
}

const bumperList = []; // { c, r, gain, value, flash, hits }
function addBumper(c, r, gain=1.6, value=100){ bumperList.push({c, r, gain, value, flash:0, hits:0}); }

const slingList = []; // { a, b, normal, gain, value, flash }
function addSling(a, b, gain=1.5, value=50){
  const sx = b.x-a.x, sy = b.y-a.y;
  let nx = -sy, ny = sx;
  const nl = Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
  slingList.push({ a, b, normal:{x:nx,y:ny}, gain, value, flash:0 });
  addSegment(a, b, { restitution: 0.7, kind:'sling' });
}

const dropList = []; // { c (center), w, h, down, downUntil, value }
function addDrop(c, w=24, h=8, value=200){ dropList.push({ c, w, h, down:false, downUntil:0, value }); }

const topLaneList = []; // { xMin, xMax, label, lit }
let topLanesZoneCooldown = false; // prevents re-detection after completion while ball still in zone

function clearTable(){
  segments.length = 0;
  arcRegistry.length = 0;
  slingList.length = 0;
  bumperList.length = 0;
  dropList.length = 0;
  topLaneList.length = 0;
  gateSeg = null;
}

function serveBall(){
  ball.p = { x: 400, y: 680 };
  ball.v = { x: 0, y: 0 };
  state.phase = 'ready';
  state.spellJackpotBase = 5000;
  state.ballWasLaunched = false;
  state.saverUntil = performance.now()/1000 + 5;
}

function restartGame(){
  state.score = 0;
  state.balls = 3;
  state.mult = 1;
  state.comboCount = 0;
  state.comboUntil = 0;
  state.dropCycles = 0;
  state.saverUntil = performance.now()/1000 + 5;
  state.phase = 'ready';
  state.kickback = true;
  state.kickbackFlash = 0;
  state.bumperHits = 0;
  state.superBumpersUntil = 0;
  state.bumperChainCount = 0;
  state.bumperChainUntil = 0;
  state.extraBallAwarded = false;
  state.rightKickback = true;
  state.rightKickbackFlash = 0;
  state.spellJackpotBase = 5000;
  state.ballWasLaunched = false;
  topLanesZoneCooldown = false;
  floatTexts.length = 0;
  clearTable();
  buildTable();
  for (const f of [flippers.L, flippers.R, flippers.miniL].filter(Boolean)){
    f.angle = f.angleRest;
    f.angVel = 0;
    f.pressed = false;
  }
  serveBall();
}

function handleDrain(){
  if (ball.p.y <= CONFIG.H + 50) return;
  const nowSec = performance.now()/1000;
  dispatchThemeEvent('drain', { x:(DRAIN_LEFT + DRAIN_RIGHT)/2, y:CONFIG.H - 8 });
  if (state.saverUntil && nowSec < state.saverUntil){
    serveBall();
    return;
  }
  state.balls = Math.max(0, state.balls - 1);
  if (state.balls <= 0){
    state.phase = 'gameover';
    dispatchThemeEvent('game_over', { x: CONFIG.W/2, y: CONFIG.H/2 });
    if (state.score > state.hi) state.hi = state.score;
    ball.p = { x: -100, y: -100 };
    ball.v = { x: 0, y: 0 };
    return;
  }
  serveBall();
}

function registerScoreEvent(){
  state.comboCount += 1;
  state.comboUntil = performance.now()/1000 + 1.5;
  const prev = state.mult;
  if      (state.comboCount >= 12) state.mult = 4;
  else if (state.comboCount >=  7) state.mult = 3;
  else if (state.comboCount >=  3) state.mult = 2;
  else                             state.mult = 1;
  if (state.mult > prev){
    const lbl = ['','','x2 COMBO!','x3 COMBO!','x4 MEGA COMBO!'];
    spawnFloat(lbl[state.mult] || 'x'+state.mult, CONFIG.W/2, 380, '#fc4');
  }
}

function maybeAwardExtraBall(){
  if (state.extraBallAwarded || state.score < EXTRA_BALL_SCORE) return false;
  state.extraBallAwarded = true;
  state.balls += 1;
  spawnFloat('EXTRA BALL!', CONFIG.W/2, 320, '#5f5');
  spawnParticles(CONFIG.W/2, 320, 26, '#5f5');
  playThemeSound('ui_toggle');
  shake = Math.max(shake, 10);
  return true;
}

function applyScore(points){
  state.score += points;
  maybeAwardExtraBall();
}

function handleTopLanesComplete(){
  const mode = getActiveMode();
  const nowSec = performance.now()/1000;
  if (mode.onLaneComplete === 'multiplier'){
    if (state.mult < 4){
      state.mult += 1;
      spawnFloat('LANES! MULT x' + state.mult, CONFIG.W/2, 200, '#fc4');
    } else {
      applyScore(5000 * state.mult);
      spawnFloat('MAX MULT! +' + (5000 * state.mult), CONFIG.W/2, 200, '#fc4');
    }
    spawnParticles(CONFIG.W/2, 80, 20, '#fc4');
    dispatchThemeEvent('jackpot', { x: CONFIG.W/2, y: 80 });
    shake = Math.max(shake, 12);
  } else if (mode.onLaneComplete === 'points-burst'){
    const pts = 1000 * state.mult;
    applyScore(pts);
    spawnFloat('LANE BONUS +' + pts, CONFIG.W/2, 200, '#5cf');
    spawnParticles(CONFIG.W/2, 80, 20, '#5cf');
    dispatchThemeEvent('drop_clear', { x: CONFIG.W/2, y: 80 });
    shake = Math.max(shake, 8);
  } else if (mode.onLaneComplete === 'jackpot'){
    const pts = state.spellJackpotBase * state.mult;
    applyScore(pts);
    spawnFloat('N-E-O-N! +' + pts, CONFIG.W/2, 200, '#0ff');
    spawnParticles(CONFIG.W/2, 80, 30, '#0ff');
    dispatchThemeEvent('jackpot', { x: CONFIG.W/2, y: 80 });
    state.spellJackpotBase = Math.min(state.spellJackpotBase * 2, 80000);
    shake = Math.max(shake, 16);
  } else if (mode.onLaneComplete === 'super-all'){
    state.superBumpersUntil = nowSec + 10;
    state.bumperChainCount = 0;
    spawnFloat('FRENZY! ALL SUPER!', CONFIG.W/2, 200, '#f3a');
    spawnParticles(CONFIG.W/2, 80, 40, '#f3a');
    dispatchThemeEvent('jackpot', { x: CONFIG.W/2, y: 80 });
    shake = Math.max(shake, 20);
  }
  for (const lane of topLaneList) lane.lit = false;
}

function bumperSuperActive(nowSec = performance.now()/1000){
  return state.superBumpersUntil > nowSec;
}

function registerBumperHit(bp, nowSec){
  bp.flash = 0.45;
  bp.hits += 1;
  state.bumperHits += 1;
  if (state.bumperChainUntil && nowSec > state.bumperChainUntil) state.bumperChainCount = 0;
  state.bumperChainCount += 1;
  state.bumperChainUntil = nowSec + 2.2;
  for (const other of bumperList){
    if (other === bp) continue;
    const dist = Math.hypot(other.c.x - bp.c.x, other.c.y - bp.c.y);
    if (dist <= 120) other.flash = Math.max(other.flash, 0.22);
  }
  if (state.bumperChainCount >= 3 && !bumperSuperActive(nowSec)){
    state.superBumpersUntil = nowSec + 8;
    state.bumperChainCount = 0;
    spawnFloat('SUPER BUMPERS!', CONFIG.W/2, 286, '#0ff');
    spawnParticles(CONFIG.W/2, 250, 36, '#0ff');
    shake = Math.max(shake, 16);
  }
}

function physicsStep(dt){
  flippers.L.pressed = input.L;
  flippers.R.pressed = input.R;
  if (flippers.miniL) flippers.miniL.pressed = input.L;
  const nowSec = performance.now()/1000;
  for (const dp of dropList){ if (dp.down && dp.downUntil && nowSec >= dp.downUntil){ dp.down = false; dp.downUntil = 0; } }
  if (state.comboUntil && nowSec > state.comboUntil){
    state.comboCount = 0;
    state.comboUntil = 0;
    state.mult = 1;
  }
  flipperStep(dt);
  if (gateSeg) gateSeg.enabled = !(ball.p.x > SHOOTER_X && ball.v.y < 0);
  // Integrate forces
  ball.v.y += CONFIG.GRAVITY * dt;
  const drag = Math.pow(CONFIG.DRAG_PER_SEC, dt * 240);
  ball.v.x *= drag; ball.v.y *= drag;

  let remaining = 1.0;
  for (let iter = 0; iter < 6 && remaining > 1e-4; iter++){
    const d = { x: ball.v.x * dt * remaining, y: ball.v.y * dt * remaining };
    let best = null;
    for (const s of segments){
      if (s.enabled === false) continue;
      const hit = sweepCircleSegment(ball.p, d, ball.r, s.a, s.b);
      if (hit && (!best || hit.toi < best.toi)){ best = hit; best.surface = s; }
    }
    for (const a of arcRegistry){
      const hit = sweepCircleArc(ball.p, d, ball.r, a.c, a.R, a.a0, a.a1, a.outward);
      if (hit && (!best || hit.toi < best.toi)){ best = hit; best.surface = a; }
    }
    for (const f of [flippers.L, flippers.R, flippers.miniL].filter(Boolean)){
      if (f === flippers.miniL && !f.pressed && Math.abs(f.angVel) < 0.01) continue;
      const hit = flipperCollide(f, ball.p, d, ball.r);
      if (hit && (!best || hit.toi < best.toi)) best = { ...hit, surface: { kind:'flipper', restitution: 0.2 } };
    }
    for (const bp of bumperList){
      const hit = sweepCircleArc(ball.p, d, ball.r, bp.c, bp.r, 0, 2*Math.PI, true);
      if (hit && (!best || hit.toi < best.toi)) best = { ...hit, surface:{ kind:'bumper', restitution: 0.8 }, bumper: bp };
    }
    for (const dp of dropList){
      if (dp.down) continue;
      const a = { x: dp.c.x - dp.w/2, y: dp.c.y - dp.h/2 };
      const b = { x: dp.c.x + dp.w/2, y: dp.c.y - dp.h/2 };
      const hit = sweepCircleSegment(ball.p, d, ball.r, a, b);
      if (hit && (!best || hit.toi < best.toi)) best = { ...hit, surface:{ kind:'drop', restitution:0.3 }, drop: dp };
    }
    if (!best){
      ball.p.x += d.x; ball.p.y += d.y;
      remaining = 0;
      break;
    }
    if (best.flipper){
      const f = best.flipper;
      const eps = 1e-3;
      ball.p.x += d.x * Math.max(0, best.toi - eps);
      ball.p.y += d.y * Math.max(0, best.toi - eps);
      const arm = { x: ball.p.x - f.pivot.x, y: ball.p.y - f.pivot.y };
      const vSurf = { x: -arm.y * f.angVel, y: arm.x * f.angVel };
      const vRel = { x: ball.v.x - vSurf.x, y: ball.v.y - vSurf.y };
      const dn = vRel.x*best.normal.x + vRel.y*best.normal.y;
      const e = 1.05;
      const rx = vRel.x - (1+e)*dn*best.normal.x;
      const ry = vRel.y - (1+e)*dn*best.normal.y;
      ball.v.x = vSurf.x + rx;
      ball.v.y = vSurf.y + ry;
      ball.p.x += best.normal.x * 0.01;
      ball.p.y += best.normal.y * 0.01;
      if (best.penetration){
        ball.p.x += best.normal.x * best.penetration;
        ball.p.y += best.normal.y * best.penetration;
      }
      remaining *= (1 - best.toi);
      continue;
    }
    if (best.bumper){
      const bp = best.bumper;
      const eps = 1e-3;
      ball.p.x += d.x * Math.max(0, best.toi - eps);
      ball.p.y += d.y * Math.max(0, best.toi - eps);
      const superBumpers = bumperSuperActive(nowSec);
      const speed = Math.hypot(ball.v.x, ball.v.y);
      const inSpeed = Math.max(speed, 400);
      const outSpeed = Math.max(inSpeed * (bp.gain + (superBumpers ? 0.35 : 0)), superBumpers ? 780 : 600);
      ball.v.x = best.normal.x * outSpeed;
      ball.v.y = best.normal.y * outSpeed;
      ball.p.x += best.normal.x * 0.5;
      ball.p.y += best.normal.y * 0.5;
      registerBumperHit(bp, nowSec);
      dispatchThemeEvent('bumper_hit', { x: ball.p.x, y: ball.p.y });
      const bumperValue = bp.value + (superBumpers ? 350 : 0);
      applyScore(bumperValue * state.mult);
      registerScoreEvent();
      spawnParticles(ball.p.x, ball.p.y, superBumpers ? 30 : 22, superBumpers ? '#0ff' : '#5cf');
      if (superBumpers) spawnFloat('SUPER +' + (bumperValue * state.mult), bp.c.x, bp.c.y - 26, '#0ff');
      shake = superBumpers ? 14 : 10;
      if (state.bumperHits % 25 === 0){
        applyScore(10000 * state.mult);
        spawnFloat('JACKPOT! +10000', CONFIG.W/2, 240, '#f5a');
        spawnParticles(bp.c.x, bp.c.y, 40, '#f5a');
        dispatchThemeEvent('jackpot', { x: CONFIG.W/2, y: 240 });
        shake = 20;
      }
      remaining *= (1 - best.toi);
      continue;
    }
    if (best.drop){
      const dp = best.drop;
      const eps = 1e-3;
      ball.p.x += d.x * Math.max(0, best.toi - eps);
      ball.p.y += d.y * Math.max(0, best.toi - eps);
      const e = 0.3;
      const vn = ball.v.x * best.normal.x + ball.v.y * best.normal.y;
      ball.v.x -= (1 + e) * vn * best.normal.x;
      ball.v.y -= (1 + e) * vn * best.normal.y;
      ball.p.x += best.normal.x * 0.01;
      ball.p.y += best.normal.y * 0.01;
      dp.down = true;
      dp.downUntil = performance.now()/1000 + 3.5;
      applyScore(dp.value * state.mult);
      registerScoreEvent();
      spawnParticles(ball.p.x, ball.p.y, 8, '#fc4');
      dispatchThemeEvent('drop_clear', { x: ball.p.x, y: ball.p.y });
      if (dropList.every(d => d.down)){
        state.dropCycles += 1;
        const clearBonus = 1500 * Math.min(state.dropCycles, 6) * state.mult;
        applyScore(clearBonus);
        spawnFloat('DROP BONUS +' + clearBonus, CONFIG.W/2, 340, '#fc4');
        state.kickback = true; // rearm kickback on every bank clear
        state.rightKickback = true;
        for (const d of dropList){ d.down = false; d.downUntil = 0; }
      }
      remaining *= (1 - best.toi);
      continue;
    }
    const eps = 1e-3;
    ball.p.x += d.x * Math.max(0, best.toi - eps);
    ball.p.y += d.y * Math.max(0, best.toi - eps);
    const e = best.surface.restitution;
    const vn = ball.v.x * best.normal.x + ball.v.y * best.normal.y;
    const restThreshold = CONFIG.GRAVITY * dt * 2;
    const factor = (-vn < restThreshold) ? 1.0 : (1 + e);
    ball.v.x -= factor * vn * best.normal.x;
    ball.v.y -= factor * vn * best.normal.y;
    ball.p.x += best.normal.x * 0.01;
    ball.p.y += best.normal.y * 0.01;
    if (best.surface && best.surface.kind === 'sling'){
      const sl = slingList.find(s => s.a === best.surface.a || s.b === best.surface.b);
      if (sl){
        const speed = Math.hypot(ball.v.x, ball.v.y);
        const boost = Math.max(speed * (sl.gain - 1), 250);
        // Use the collision normal (always points away from the surface, toward
        // the ball) so the boost reliably pushes the ball off the sling instead
        // of into it.
        ball.v.x += best.normal.x * boost;
        ball.v.y += best.normal.y * boost;
        sl.flash = 0.15;
        dispatchThemeEvent('sling_hit', { x: ball.p.x, y: ball.p.y });
        applyScore(sl.value * state.mult);
        registerScoreEvent();
        spawnParticles(ball.p.x, ball.p.y, 10, '#f3a');
        shake = 5;
      }
    }
    remaining *= (1 - best.toi);
  }
  // Kickback: fires the ball back out of the left outlane when armed.
  if (state.kickback && ball.p.x > 2 && ball.p.x < 64 && ball.p.y > 550 && ball.p.y < 700){
    ball.p.x = KICKBACK_EJECT.x;
    ball.p.y = KICKBACK_EJECT.y;
    ball.v.x = KICKBACK_EJECT.vx;
    ball.v.y = KICKBACK_EJECT.vy;
    state.kickback = false;
    state.kickbackFlash = 0.8;
    spawnParticles(26, 620, 24, '#0ff');
    spawnFloat('KICKBACK!', 92, 540, '#0ff');
    shake = 12;
  }
  // Right kickback (symmetric to left)
  if (state.rightKickback && state.ballWasLaunched && ball.p.x > 393 && ball.p.x < 418 && ball.p.y > 550 && ball.p.y < 700 && ball.v.y > 0){
    ball.p.x = RIGHT_KICKBACK_EJECT.x;
    ball.p.y = RIGHT_KICKBACK_EJECT.y;
    ball.v.x = RIGHT_KICKBACK_EJECT.vx;
    ball.v.y = RIGHT_KICKBACK_EJECT.vy;
    state.rightKickback = false;
    state.rightKickbackFlash = 0.8;
    spawnParticles(RIGHT_KICKBACK_EJECT.x, 600, 24, '#0ff');
    spawnFloat('KICKBACK!', CONFIG.W - 88, 540, '#0ff');
    shake = 12;
  }
  handleDrain();
  // Top lane detection — zone extends to y<80 so balls placed/launched near y=70 register correctly.
  // Triggers on both upward and downward travel (standard pinball behaviour).
  if (ball.p.y > 24 && ball.p.y < 80){
    if (!topLanesZoneCooldown){
      for (const lane of topLaneList){
        if (!lane.lit && ball.p.x >= lane.xMin && ball.p.x <= lane.xMax){
          lane.lit = true;
          applyScore(100 * state.mult);
          registerScoreEvent();
          spawnFloat(lane.label ? lane.label + '!' : '+100', ball.p.x, 68, '#5cf');
          if (topLaneList.every(l => l.lit)){
            handleTopLanesComplete();
            topLanesZoneCooldown = true;
          }
          break;
        }
      }
    }
  } else {
    topLanesZoneCooldown = false;
  }
}

// ============ 4. TABLE ============
const walls = []; const arcs = []; const bumpers = []; const slings = []; const drops = [];
const SHOOTER_X = 380;
const SHOOTER_GATE_Y = 80;
const DRAIN_LEFT = 175, DRAIN_RIGHT = 245;
const KICKBACK_EJECT = { x: 68, y: 510, vx: 340, vy: -580 };

function buildTable(){
  const mode = getActiveMode();

  // ── Fixed geometry shared by all modes ──
  addSegment({x:0,   y:24},  {x:SHOOTER_X, y:24});
  addSegment({x:0,   y:24},  {x:0,        y:CONFIG.H});
  addSegment({x:CONFIG.W, y:24}, {x:CONFIG.W, y:CONFIG.H});
  addSegment({x:0,           y:CONFIG.H-20}, {x:DRAIN_LEFT,  y:CONFIG.H});
  addSegment({x:DRAIN_RIGHT,  y:CONFIG.H},   {x:SHOOTER_X,   y:CONFIG.H-20});
  addSegment({x:SHOOTER_X,    y:CONFIG.H-20},{x:CONFIG.W,    y:CONFIG.H-20});
  addSegment({x:SHOOTER_X, y:120}, {x:SHOOTER_X, y:CONFIG.H-40});
  addSegment({x:SHOOTER_X, y:24}, {x:CONFIG.W, y:120}, { restitution: 0.92 });

  addSegment({x:32,  y:490}, {x:26,  y:668});
  addSegment({x:388, y:490}, {x:394, y:668});
  addSegment({x:55,  y:490}, {x:38,  y:490});  // horizontal cap (ball-test zone stays flat)
  addSegment({x:38,  y:490}, {x:32,  y:483});  // tiny diagonal to break the 90° pocket corner
  addSegment({x:365, y:490}, {x:388, y:490});
  // Anti-pocket deflector: closes the narrow corridor between left sling and left inner wall
  addSegment({x:45, y:512}, {x:62, y:544});
  // Anti-pocket deflector: closes the narrow corridor between right sling and right inner wall
  addSegment({x:375, y:512}, {x:358, y:544});
  addSegment({x:115, y:600}, {x:120, y:618});
  addSegment({x:305, y:600}, {x:300, y:618});
  addSegment({x:75,  y:440}, {x:130, y:468});
  addSegment({x:345, y:440}, {x:290, y:468});

  addSling({x:55,  y:490}, {x:115, y:600}, 1.65, 80);
  addSling({x:365, y:490}, {x:305, y:600}, 1.65, 80);

  // ── Mode-specific obstacles ──
  for (const bp of mode.bumpers) addBumper(bp.c, bp.r, bp.gain, bp.value);
  for (const dp of mode.drops)   addDrop(dp.c, dp.w, dp.h, dp.value);
  for (const ap of (mode.arcs||[])) addArc(ap.c, ap.R, ap.a0, ap.a1, { outward: ap.outward, restitution: ap.restitution });

  // ── Mode-specific guide rails (deflect ball differently per mode) ──
  for (const g of mode.guides)   addSegment(g.a, g.b, { kind: 'guide', restitution: 0.8 });

  // ── Top lanes ──
  const xStart = 10, xEnd = 355;
  const laneWidth = (xEnd - xStart) / mode.laneCount;
  for (let i = 0; i < mode.laneCount; i++){
    topLaneList.push({
      xMin: xStart + i * laneWidth,
      xMax: xStart + (i + 1) * laneWidth,
      label: mode.laneLabels ? mode.laneLabels[i] : null,
      lit: false,
    });
  }
}

buildTable();

// ============ 5. FLIPPERS ============
const flippers = { L: null, R: null, miniL: null };
function makeFlipper(pivot, side){
  const restAngle = side==='L' ? 0.45 : Math.PI - 0.45;
  const upAngle   = side==='L' ? -0.45 : Math.PI + 0.45;
  return {
    pivot, side, length: 62, tipR: 7, baseR: 11,
    angle: restAngle, angleRest: restAngle, angleUp: upAngle,
    angVel: 0, state: 'rest',
    pressed: false,
  };
}

flippers.L = makeFlipper({x:135, y:620}, 'L');
flippers.R = makeFlipper({x:285, y:620}, 'R');

function makeMiniFlipperL(){
  // Pivot on left wall at top of left outlane (y=492, x=30)
  // Rest: angled right-downward (0.9 rad ≈ 52°, tip points right and slightly down)
  // Up: angled right-upward (−0.4 rad ≈ −23°, tip points right and up → deflects ball inward)
  return {
    pivot: { x: 30, y: 492 },
    side: 'L',
    length: 38, tipR: 5, baseR: 8,
    angle: 0.9, angleRest: 0.9, angleUp: -0.4,
    angVel: 0, state: 'rest',
    pressed: false,
  };
}
flippers.miniL = makeMiniFlipperL();

function flipperTip(f){
  return { x: f.pivot.x + Math.cos(f.angle)*f.length, y: f.pivot.y + Math.sin(f.angle)*f.length };
}

function flipperStep(dt){
  for (const f of [flippers.L, flippers.R, flippers.miniL].filter(Boolean)){
    const target = f.pressed ? f.angleUp : f.angleRest;
    const delta = target - f.angle;
    const maxSpeed = f.pressed ? 18 : 10;  // rad/s
    const step = Math.sign(delta) * Math.min(Math.abs(delta), maxSpeed * dt);
    f.angVel = dt > 0 ? step / dt : 0;
    f.angle += step;
  }
}

function flipperCollide(f, p0, d, r){
  const tip = flipperTip(f);
  // Overlap rescue: flipper may sweep into a (near-)stationary ball between substeps.
  // Detect penetration of the swept-radius capsule and report a toi=0 hit so the
  // surface-velocity kick branch can resolve it.
  const ax = tip.x - f.pivot.x, ay = tip.y - f.pivot.y;
  const segLen2 = ax*ax + ay*ay;
  let tParam = ((p0.x - f.pivot.x)*ax + (p0.y - f.pivot.y)*ay) / segLen2;
  tParam = Math.max(0, Math.min(1, tParam));
  const cx = f.pivot.x + ax*tParam, cy = f.pivot.y + ay*tParam;
  const dx = p0.x - cx, dy = p0.y - cy;
  const dist = Math.hypot(dx, dy);
  const radSum = r + (tParam < 0.5 ? f.baseR : f.tipR);
  if (dist < radSum - 1e-3){
    const arm = { x: cx - f.pivot.x, y: cy - f.pivot.y };
    const vSurf = { x: -arm.y * f.angVel, y: arm.x * f.angVel };
    const vmag = Math.hypot(vSurf.x, vSurf.y);
    let nx, ny;
    if (vmag > 1e-3){ nx = vSurf.x / vmag; ny = vSurf.y / vmag; }
    else { const nl = dist || 1; nx = dx/nl; ny = dy/nl; }
    return { toi: 0, normal: { x: nx, y: ny }, flipper: f, penetration: (radSum - dist) + 0.5 };
  }
  const seg = sweepCircleSegment(p0, d, r + f.tipR, f.pivot, tip);
  const ca = sweepCircleEnd(p0, d, r + f.baseR, f.pivot);
  const cb = sweepCircleEnd(p0, d, r + f.tipR, tip);
  let best = null;
  for (const h of [seg, ca, cb]) if (h && (!best || h.toi < best.toi)) best = h;
  if (!best) return null;
  return { ...best, flipper: f };
}

function getAudioContext(){
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  return ac;
}

function playThemeSound(type){
  if (!settings.soundEnabled) return;
  const theme = getActiveTheme();
  const s = theme.audio[type];
  if (!s) return;
  try {
    const a = getAudioContext();
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.type = s.wave;
    osc.frequency.value = s.freq;
    gain.gain.value = s.gain;
    osc.connect(gain);
    gain.connect(a.destination);
    const t0 = a.currentTime;
    osc.start(t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + s.dur);
    osc.stop(t0 + s.dur);
    audioPlayCount += 1;
  } catch {
    // Audio may be unavailable in some environments (tests/headless); ignore.
  }
}

function enqueueLightEffect(type, payload={}){
  const theme = getActiveTheme();
  const recipe = theme.lights[type];
  if (!recipe) return;
  if (lightEffects.length > 96) lightEffects.shift();
  lightEffects.push({
    x: payload.x ?? CONFIG.W/2,
    y: payload.y ?? CONFIG.H/2,
    color: recipe.color,
    life: recipe.life,
    maxLife: recipe.life,
    size: recipe.size,
    type: recipe.type,
    phase: 0,
  });
}

function dispatchThemeEvent(type, payload={}){
  enqueueLightEffect(type, payload);
  playThemeSound(type);
}

function updateLightEffects(dt){
  for (let i = lightEffects.length - 1; i >= 0; i--){
    const e = lightEffects[i];
    e.life -= dt;
    e.phase += dt * 12;
    if (e.life <= 0) lightEffects.splice(i, 1);
  }
}

function renderLightEffects(){
  for (const e of lightEffects){
    const a = Math.max(0, e.life / e.maxLife);
    const pulse = e.type === 'strobeBurst' ? (Math.sin(e.phase * 8) > 0 ? 1 : 0.45) : 1;
    const r = e.size * (1 + (1 - a) * 0.9);
    ctx.save();
    ctx.globalAlpha = a * 0.45 * pulse;
    ctx.shadowColor = e.color;
    ctx.shadowBlur = 22;
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function withAlpha(color, alpha){
  if (typeof color !== 'string' || color[0] !== '#') return color;
  let h = color.slice(1);
  if (h.length === 3) h = h.split('').map(ch => ch + ch).join('');
  const n = parseInt(h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
}

function roundRectPath(c, x, y, w, h, r){
  const rr = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath();
  c.moveTo(x + rr, y);
  c.lineTo(x + w - rr, y);
  c.quadraticCurveTo(x + w, y, x + w, y + rr);
  c.lineTo(x + w, y + h - rr);
  c.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  c.lineTo(x + rr, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - rr);
  c.lineTo(x, y + rr);
  c.quadraticCurveTo(x, y, x + rr, y);
  c.closePath();
}

function drawBolt(c, x, y, r, cab){
  const g = c.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.15, x, y, r);
  g.addColorStop(0, '#fffdf4');
  g.addColorStop(0.45, cab.chrome || '#eee');
  g.addColorStop(1, '#4c4338');
  c.beginPath();
  c.arc(x, y, r, 0, Math.PI * 2);
  c.fillStyle = g;
  c.fill();
  c.strokeStyle = 'rgba(0,0,0,0.45)';
  c.lineWidth = 0.8;
  c.stroke();
}

function drawStar(c, cx, cy, outer, inner, color){
  c.save();
  c.beginPath();
  for (let i = 0; i < 10; i++){
    const r = i % 2 === 0 ? outer : inner;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
  }
  c.closePath();
  c.fillStyle = color;
  c.fill();
  c.restore();
}

function drawSparkle(c, x, y, r, color){
  c.save();
  c.fillStyle = color;
  c.beginPath();
  c.moveTo(x, y - r);
  c.lineTo(x + r * 0.3, y - r * 0.3);
  c.lineTo(x + r, y);
  c.lineTo(x + r * 0.3, y + r * 0.3);
  c.lineTo(x, y + r);
  c.lineTo(x - r * 0.3, y + r * 0.3);
  c.lineTo(x - r, y);
  c.lineTo(x - r * 0.3, y - r * 0.3);
  c.closePath();
  c.fill();
  c.restore();
}

// ── Seven-segment score displays ──
const SEG7 = {
  '0': 'abcdef', '1': 'bc', '2': 'abged', '3': 'abgcd', '4': 'fgbc',
  '5': 'afgcd', '6': 'afgedc', '7': 'abc', '8': 'abcdefg', '9': 'abcfgd',
};

function seg7Lines(x, y, w, h){
  const t = Math.max(2, h * 0.14);
  const p = t * 0.55;
  const mid = y + h / 2;
  return {
    a: [x + p + t, y + t / 2, x + w - p - t, y + t / 2],
    b: [x + w - t / 2, y + p + t, x + w - t / 2, mid - p],
    c: [x + w - t / 2, mid + p, x + w - t / 2, y + h - p - t],
    d: [x + p + t, y + h - t / 2, x + w - p - t, y + h - t / 2],
    e: [x + t / 2, mid + p, x + t / 2, y + h - p - t],
    f: [x + t / 2, y + p + t, x + t / 2, mid - p],
    g: [x + p + t, mid, x + w - p - t, mid],
  };
}

function drawSeg7Digit(c, x, y, w, h, ch, onColor, offColor, glow){
  const segs = seg7Lines(x, y, w, h);
  const t = Math.max(2, h * 0.14);
  c.save();
  c.lineCap = 'round';
  c.lineWidth = t;
  c.strokeStyle = offColor;
  for (const k in segs){
    const s = segs[k];
    c.beginPath(); c.moveTo(s[0], s[1]); c.lineTo(s[2], s[3]); c.stroke();
  }
  const lit = SEG7[ch] || '';
  if (lit){
    c.strokeStyle = onColor;
    if (glow){ c.shadowColor = onColor; c.shadowBlur = glow; }
    for (const k of lit){
      const s = segs[k];
      c.beginPath(); c.moveTo(s[0], s[1]); c.lineTo(s[2], s[3]); c.stroke();
    }
  }
  c.restore();
}

function drawSeg7Number(c, x, y, w, h, gap, value, digits, onColor, offColor, glow){
  const max = Math.pow(10, digits) - 1;
  const str = String(Math.max(0, Math.min(max, Math.floor(value)))).padStart(digits, '0');
  for (let i = 0; i < digits; i++){
    drawSeg7Digit(c, x + i * (w + gap), y, w, h, str[i], onColor, offColor, glow);
  }
}

  c.shadowBlur = 0;
  c.lineWidth = 1;
  c.strokeStyle = 'rgba(0,0,0,0.38)';
  c.strokeText('PINBALL', x + 18, y + 72);

  c.font = `6px ${FONT_PIXEL}`;
  c.fillStyle = withAlpha(p.textPrimary, 0.7);
  c.fillText('RETRO FLIPPER MACHINE', x + 20, y + 90);

  drawSparkle(c, x + 10, y + 54, 4, withAlpha(cab.trim, 0.7));
  drawSparkle(c, x + w * 0.52, y + 18, 2.5, withAlpha(cab.trim, 0.4));
  c.restore();
}

function paintBackdrop(c, theme){
  const cab = theme.cabinet;
  const W = VIEW.W, H = VIEW.H;
  c.clearRect(0, 0, W, H);

  // Machine silhouette / floor shadow
  c.save();
  c.shadowColor = 'rgba(0,0,0,0.9)';
  c.shadowBlur = 34;
  c.shadowOffsetY = 20;
  roundRectPath(c, 10, 10, W - 20, H - 20, 28);
  c.fillStyle = '#0b0604';
  c.fill();
  c.restore();

  // Cabinet body
  const body = c.createLinearGradient(0, 10, 0, H - 10);
  body.addColorStop(0, cab.wood[0]);
  body.addColorStop(0.42, cab.wood[1]);
  body.addColorStop(1, cab.wood[2]);
  roundRectPath(c, 10, 10, W - 20, H - 20, 28);
  c.fillStyle = body;
  c.fill();

  // Wood grain
  c.save();
  roundRectPath(c, 10, 10, W - 20, H - 20, 28);
  c.clip();
  for (let i = 0; i < 40; i++){
    const x = 12 + i * 14;
    c.strokeStyle = withAlpha(cab.wood[0], i % 3 === 0 ? 0.13 : 0.07);
    c.lineWidth = i % 4 === 0 ? 1.4 : 0.8;
    c.beginPath();
    c.moveTo(x, 10);
    c.bezierCurveTo(x + 7, H * 0.28, x - 9, H * 0.68, x + 4, H - 10);
    c.stroke();
  }
  c.restore();

  // Outer gold trim
  roundRectPath(c, 10, 10, W - 20, H - 20, 28);
  c.lineWidth = 3;
  c.strokeStyle = cab.trim;
  c.shadowColor = withAlpha(cab.trim, 0.8);
  c.shadowBlur = 12;
  c.stroke();
  c.shadowBlur = 0;
  roundRectPath(c, 15, 15, W - 30, H - 30, 23);
  c.lineWidth = 1;
  c.strokeStyle = 'rgba(255,255,255,0.16)';
  c.stroke();

  // Side rails
  for (const side of ['L', 'R']){
    const x0 = side === 'L' ? 14 : W - 58;
    const g = c.createLinearGradient(x0, 0, x0 + 44, 0);
    if (side === 'L'){
      g.addColorStop(0, cab.wood[2]);
      g.addColorStop(0.4, cab.wood[1]);
      g.addColorStop(1, cab.wood[0]);
    } else {
      g.addColorStop(0, cab.wood[0]);
      g.addColorStop(0.6, cab.wood[1]);
      g.addColorStop(1, cab.wood[2]);
    }
    c.fillStyle = g;
    c.fillRect(x0, 34, 44, H - 68);
  }
  c.strokeStyle = withAlpha(cab.trim, 0.55);
  c.lineWidth = 1;
  for (const x of [19, 23, W - 23, W - 19]){
    c.beginPath();
    c.moveTo(x, 58);
    c.lineTo(x, H - 64);
    c.stroke();
  }
  for (const bx of [26, W - 26]){
    for (const by of [70, 190, 310, 650, 770, 890]) drawBolt(c, bx, by, 4, cab);
  }

  c.save();
  c.translate(34, 500);
  c.rotate(-Math.PI / 2);
  c.font = `9px ${FONT_PIXEL}`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillStyle = withAlpha(cab.trim, 0.48);
  c.fillText('NEON', 0, 0);
  c.restore();

  c.save();
  c.translate(W - 34, 500);
  c.rotate(Math.PI / 2);
  c.font = `9px ${FONT_PIXEL}`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillStyle = withAlpha(cab.trim, 0.48);
  c.fillText('PINBALL', 0, 0);
  c.restore();

  // Backglass frame
  const BX = CONFIG.BACK_X, BY = CONFIG.BACK_Y, BW = CONFIG.BACK_W, BH = CONFIG.BACK_H;
  c.save();
  c.shadowColor = 'rgba(0,0,0,0.72)';
  c.shadowBlur = 18;
  c.shadowOffsetY = 6;
  roundRectPath(c, BX - 6, BY - 6, BW + 12, BH + 12, 12);
  c.fillStyle = '#100805';
  c.fill();
  c.restore();

  const frameGrad = c.createLinearGradient(BX, BY, BX, BY + BH);
  frameGrad.addColorStop(0, cab.trim);
  frameGrad.addColorStop(0.32, withAlpha(cab.trim, 0.5));
  frameGrad.addColorStop(0.62, cab.trim);
  frameGrad.addColorStop(1, cab.trimDark);
  roundRectPath(c, BX - 4, BY - 4, BW + 8, BH + 8, 10);
  c.lineWidth = 3;
  c.strokeStyle = frameGrad;
  c.stroke();

  const glass = c.createLinearGradient(0, BY, 0, BY + BH);
  glass.addColorStop(0, cab.glass[0]);
  glass.addColorStop(1, cab.glass[1]);
  roundRectPath(c, BX, BY, BW, BH, 7);
  c.fillStyle = glass;
  c.fill();

  // Art + glass reflection
  c.save();
  roundRectPath(c, BX, BY, BW, BH, 7);
  c.clip();
  paintBackglassArt(c, BX, BY, BW, 100, theme);
  paintBackglassTitle(c, BX, BY, BW, theme);
  const shine = c.createLinearGradient(BX, BY, BX + BW * 0.8, BY + BH);
  shine.addColorStop(0, 'rgba(255,255,255,0.10)');
  shine.addColorStop(0.28, 'rgba(255,255,255,0)');
  shine.addColorStop(0.7, 'rgba(255,255,255,0)');
  shine.addColorStop(1, 'rgba(255,255,255,0.045)');
  c.fillStyle = shine;
  c.fillRect(BX, BY, BW, BH);
  c.restore();

  // Display glass
  const dy = BY + 100;
  const display = c.createLinearGradient(0, dy, 0, BY + BH);
  display.addColorStop(0, 'rgba(0,0,0,0.72)');
  display.addColorStop(1, 'rgba(0,0,0,0.92)');
  c.fillStyle = display;
  c.fillRect(BX + 1, dy, BW - 2, BH - 101);
  c.strokeStyle = withAlpha(cab.trim, 0.5);
  c.lineWidth = 1;
  c.beginPath();
  c.moveTo(BX + 6, dy);
  c.lineTo(BX + BW - 6, dy);
  c.stroke();

  c.strokeStyle = 'rgba(255,255,255,0.08)';
  for (const dx of [BX + 156, BX + 194, BX + 232]){
    c.beginPath();
    c.moveTo(dx, dy + 8);
    c.lineTo(dx, BY + BH - 8);
    c.stroke();
  }

  // Playfield bezel
  const pX = CONFIG.PLAY_X, pY = CONFIG.PLAY_Y, pW = CONFIG.PLAY_W, pH = CONFIG.PLAY_H;
  c.save();
  c.shadowColor = 'rgba(0,0,0,0.8)';
  c.shadowBlur = 14;
  c.shadowOffsetY = 4;
  roundRectPath(c, pX - 5, pY - 5, pW + 10, pH + 10, 10);
  c.fillStyle = '#0b0604';
  c.fill();
  c.restore();
  roundRectPath(c, pX - 5, pY - 5, pW + 10, pH + 10, 10);
  c.lineWidth = 2;
  c.strokeStyle = cab.trim;
  c.stroke();
  roundRectPath(c, pX - 1, pY - 1, pW + 2, pH + 2, 4);
  c.lineWidth = 2;
  c.strokeStyle = 'rgba(0,0,0,0.75)';
  c.stroke();
  for (const [bx, by] of [[pX + 8, pY + 8], [pX + pW - 8, pY + 8], [pX + 8, pY + pH - 8], [pX + pW - 8, pY + pH - 8]]){
    drawBolt(c, bx, by, 3, cab);
  }

  // Brass nameplate, drawn over the bezel seam like a real cabinet plate
  const px = BX + 6, py = BY + BH, pw = BW - 12, ph = 16;
  const plaque = c.createLinearGradient(0, py, 0, py + ph);
  plaque.addColorStop(0, cab.trim);
  plaque.addColorStop(0.55, withAlpha(cab.trim, 0.72));
  plaque.addColorStop(1, cab.trimDark);
  c.save();
  c.shadowColor = 'rgba(0,0,0,0.65)';
  c.shadowBlur = 8;
  c.shadowOffsetY = 3;
  roundRectPath(c, px, py, pw, ph, 3);
  c.fillStyle = plaque;
  c.fill();
  c.restore();
  roundRectPath(c, px, py, pw, ph, 3);
  c.strokeStyle = 'rgba(0,0,0,0.5)';
  c.lineWidth = 1;
  c.stroke();
  c.font = `7px ${FONT_PIXEL}`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillStyle = 'rgba(24,10,4,0.9)';
  c.fillText(theme.name.toUpperCase(), px + pw / 2, py + ph / 2 + 1);

  // Apron under the playfield
  const ay = pY + pH;
  const apron = c.createLinearGradient(0, ay, 0, ay + 30);
  apron.addColorStop(0, '#3b1410');
  apron.addColorStop(0.5, '#25100c');
  apron.addColorStop(1, '#160807');
  c.fillStyle = apron;
  c.fillRect(pX, ay, pW, 30);
  c.strokeStyle = withAlpha(cab.trim, 0.7);
  c.lineWidth = 1.5;
  c.beginPath();
  c.moveTo(pX, ay);
  c.lineTo(pX + pW, ay);
  c.stroke();
  c.strokeStyle = 'rgba(0,0,0,0.8)';
  c.beginPath();
  c.moveTo(pX, ay + 30);
  c.lineTo(pX + pW, ay + 30);
  c.stroke();
  for (const bx of [pX + 10, pX + pW - 10]) drawBolt(c, bx, ay + 8, 2.6, cab);

  roundRectPath(c, 20, H - 26, W - 40, 12, 6);
  c.fillStyle = withAlpha(cab.wood[2], 0.85);
  c.fill();
  c.strokeStyle = withAlpha(cab.trim, 0.55);
  c.lineWidth = 1;
  c.stroke();
}

function paintPlayfield(c, theme, mode){
  const p = theme.palette;
  const cab = theme.cabinet;
  const W = CONFIG.PLAY_W, H = CONFIG.PLAY_H;
  c.clearRect(0, 0, W, H);

  const bg = c.createRadialGradient(W * 0.5, 280, 40, W * 0.5, 380, 620);
  bg.addColorStop(0, cab.playA);
  bg.addColorStop(0.55, cab.playB);
  bg.addColorStop(1, '#020101');
  c.fillStyle = bg;
  c.fillRect(0, 0, W, H);

  // Painted motif
  c.save();
  c.beginPath();
  c.rect(0, 0, W, H);
  c.clip();

  if (theme.id === 'cosmic-wedge'){
    for (const s of STAR_FIELD){
      c.fillStyle = withAlpha('#dff6ff', 0.12 + s.r * 0.35);
      c.fillRect(s.x * W, s.y * H, 1.8, 1.8);
    }
    c.strokeStyle = withAlpha(cab.paint, 0.1);
    c.lineWidth = 1.5;
    for (const r of [70, 105, 145]){
      c.beginPath();
      c.ellipse(210, 300, r, r * 0.5, -0.35, 0, Math.PI * 2);
      c.stroke();
    }
    c.beginPath();
    c.arc(210, 300, 60, 0, Math.PI * 2);
    c.stroke();
    c.strokeStyle = withAlpha(cab.paint2, 0.14);
    c.beginPath();
    c.moveTo(20, 160);
    c.lineTo(400, 420);
    c.stroke();
  } else if (theme.id === 'volcano-pop'){
    c.fillStyle = 'rgba(0,0,0,0.22)';
    c.beginPath();
    c.moveTo(0, 380);
    c.lineTo(90, 240);
    c.lineTo(150, 320);
    c.lineTo(230, 190);
    c.lineTo(310, 330);
    c.lineTo(420, 250);
    c.lineTo(420, 430);
    c.lineTo(0, 430);
    c.closePath();
    c.fill();

    c.strokeStyle = withAlpha(cab.paint2, 0.18);
    c.lineWidth = 2;
    for (let i = 0; i < 6; i++){
      const x = 30 + i * 70;
      c.beginPath();
      c.moveTo(x, 720);
      c.bezierCurveTo(x + 8, 660, x - 12, 620, x + 16, 560);
      c.stroke();
    }
    for (let i = 0; i < 22; i++){
      c.fillStyle = withAlpha(cab.paint, 0.14);
      c.fillRect(20 + (i * 53 % 380), 110 + (i * 71 % 520), 2, 2);
    }
  } else {
    const cx = W * 0.5, cy = 330;
    for (let i = 0; i < 18; i++){
      const a0 = (i / 18) * Math.PI * 2;
      const a1 = ((i + 1) / 18) * Math.PI * 2;
      c.beginPath();
      c.moveTo(cx, cy);
      c.arc(cx, cy, 760, a0, a1);
      c.closePath();
      c.fillStyle = i % 2 === 0 ? withAlpha(cab.paint, 0.045) : withAlpha(cab.paint2, 0.02);
      c.fill();
    }
    c.strokeStyle = withAlpha(cab.paint, 0.12);
    c.lineWidth = 2;
    for (const r of [120, 175, 235]){
      c.beginPath();
      c.arc(cx, cy, r, 0, Math.PI * 2);
      c.stroke();
    }
    c.strokeStyle = withAlpha(cab.paint2, 0.16);
    c.lineWidth = 5;
    c.beginPath();
    c.arc(cx, cy, 300, Math.PI * 1.2, Math.PI * 1.8);
    c.stroke();
    for (let i = 0; i < 7; i++){
      drawSparkle(c, 40 + (i * 67) % 340, 90 + (i * 113) % 520, 4, withAlpha(cab.paint, 0.18));
    }
  }
  c.restore();

  // Painted side ribbons
  c.save();
  c.lineCap = 'round';
  for (const side of [-1, 1]){
    c.strokeStyle = withAlpha(cab.paint2, 0.07);
    c.lineWidth = 20;
    c.beginPath();
    c.moveTo(210 + side * 36, 350);
    c.bezierCurveTo(210 + side * 160, 410, 210 + side * 196, 520, 210 + side * 148, 650);
    c.stroke();
    c.strokeStyle = withAlpha(cab.paint, 0.06);
    c.lineWidth = 7;
    c.beginPath();
    c.moveTo(210 + side * 52, 360);
    c.bezierCurveTo(210 + side * 172, 430, 210 + side * 184, 530, 210 + side * 138, 650);
    c.stroke();
  }
  c.restore();

  // Scattered painted stars
  for (let i = 0; i < 8; i++){
    const sx = 30 + (i * 83 % 360);
    const sy = 120 + (i * 137 % 500);
    drawSparkle(c, sx, sy, 2 + (i % 3), withAlpha(cab.paint, 0.14));
  }

  // Lacquer streaks
  c.save();
  c.strokeStyle = 'rgba(255,255,255,0.018)';
  c.lineWidth = 14;
  for (let i = -6; i < 20; i++){
    c.beginPath();
    c.moveTo(-40 + i * 42, 0);
    c.lineTo(80 + i * 42, H);
    c.stroke();
  }
  c.restore();

  // Faint wordmark
  c.save();
  c.globalAlpha = 0.055;
  c.font = `34px ${FONT_PIXEL}`;
  c.fillStyle = cab.paint;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText('NEON', W / 2, 460);
  c.restore();

  // Painted objective
  if (mode){
    c.save();
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.font = 'bold 9px ' + FONT_UI;
    c.fillStyle = withAlpha(mode.accentColor || p.bumperGlow, 0.55);
    c.fillText('MODE // ' + mode.objective.replace('→', '>').toUpperCase(), W / 2, 548);
    c.strokeStyle = withAlpha(mode.accentColor || p.bumperGlow, 0.22);
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(W / 2 - 104, 559);
    c.lineTo(W / 2 + 104, 559);
    c.stroke();
    c.restore();
  }

  // Lane arrows
  const laneCount = Math.max(1, mode ? mode.laneCount : 5);
  const laneW = 345 / laneCount;
  c.save();
  for (let i = 0; i < laneCount; i++){
    const cx = 10 + laneW * i + laneW / 2;
    c.fillStyle = withAlpha(cab.paint, 0.3);
    c.beginPath();
    c.moveTo(cx, 62);
    c.lineTo(cx + 7, 72);
    c.lineTo(cx + 2.5, 72);
    c.lineTo(cx + 2.5, 82);
    c.lineTo(cx - 2.5, 82);
    c.lineTo(cx - 2.5, 72);
    c.lineTo(cx - 7, 72);
    c.closePath();
    c.fill();
  }
  c.restore();

  // Decorative border
  roundRectPath(c, 6, 6, W - 12, H - 12, 8);
  c.lineWidth = 2;
  c.strokeStyle = withAlpha(cab.paint, 0.3);
  c.stroke();
  roundRectPath(c, 11, 11, W - 22, H - 22, 6);
  c.lineWidth = 1;
  c.strokeStyle = withAlpha(cab.paint, 0.14);
  c.stroke();
  for (const [cx, cy] of [[16, 16], [W - 16, 16], [16, H - 16], [W - 16, H - 16]]){
    drawSparkle(c, cx, cy, 4, withAlpha(cab.paint, 0.4));
  }

  // Side lamp sockets
  for (const x of [11, W - 11]){
    for (let i = 0; i < 11; i++){
      const y = 82 + i * 56;
      c.beginPath();
      c.arc(x, y, 4.2, 0, Math.PI * 2);
      c.fillStyle = 'rgba(0,0,0,0.55)';
      c.fill();
      c.strokeStyle = withAlpha(cab.paint, 0.32);
      c.lineWidth = 1;
      c.stroke();
    }
  }

  // Shooter lane chevrons
  c.save();
  c.strokeStyle = withAlpha(cab.paint, 0.18);
  c.lineWidth = 1;
  for (let i = 0; i < 4; i++){
    const y = 600 - i * 22;
    c.beginPath();
    c.moveTo(388, y);
    c.lineTo(412, y - 7);
    c.stroke();
  }
  c.restore();

  // Glass reflection
  c.save();
  const shine = c.createLinearGradient(0, 0, W, H);
  shine.addColorStop(0, 'rgba(255,255,255,0.06)');
  shine.addColorStop(0.25, 'rgba(255,255,255,0)');
  shine.addColorStop(0.72, 'rgba(255,255,255,0)');
  shine.addColorStop(1, 'rgba(255,255,255,0.025)');
  c.fillStyle = shine;
  c.fillRect(0, 0, W, H);
  c.restore();
}

// ── Dynamic objects ──
function drawPlayfieldBulbs(nowSec, palette){
  const step = Math.floor(nowSec * 5);
  for (const x of [11, CONFIG.W - 11]){
    for (let i = 0; i < 11; i++){
      const y = 82 + i * 56;
      const on = (i + step + (x > 200 ? 1 : 0)) % 3 === 0;
      ctx.beginPath();
      ctx.arc(x, y, 3.2, 0, Math.PI * 2);
      if (on){
        ctx.fillStyle = palette.insertOn;
        ctx.shadowColor = palette.insertOn;
        ctx.shadowBlur = 7;
      } else {
        ctx.fillStyle = withAlpha(palette.insertOn, 0.14);
      }
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
}

function drawWalls(nowSec, theme, modeAccent){
  const metal = ctx.createLinearGradient(0, 0, CONFIG.W, 0);
  metal.addColorStop(0, '#7d8794');
  metal.addColorStop(0.18, '#e8eef6');
  metal.addColorStop(0.42, '#98a3b1');
  metal.addColorStop(0.68, '#f1f6fb');
  metal.addColorStop(0.86, '#87919e');
  metal.addColorStop(1, '#5f6975');

  ctx.save();
  ctx.lineCap = 'round';
  for (const s of segments){
    if (s.enabled === false) continue;
    if (s.kind === 'sling') continue;
    if (s.kind === 'guide'){
      const dashOffset = -(performance.now() / 12.5) % 26;
      ctx.strokeStyle = modeAccent;
      ctx.shadowColor = modeAccent;
      ctx.shadowBlur = 9 + 4 * Math.sin(nowSec * 3);
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 5]);
      ctx.lineDashOffset = dashOffset;
      ctx.beginPath();
      ctx.moveTo(s.a.x, s.a.y);
      ctx.lineTo(s.b.x, s.b.y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineDashOffset = 0;
      ctx.shadowBlur = 0;
      continue;
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(s.a.x, s.a.y + 1);
    ctx.lineTo(s.b.x, s.b.y + 1);
    ctx.stroke();

    ctx.strokeStyle = metal;
    ctx.lineWidth = 3.4;
    ctx.beginPath();
    ctx.moveTo(s.a.x, s.a.y);
    ctx.lineTo(s.b.x, s.b.y);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(s.a.x, s.a.y - 0.8);
    ctx.lineTo(s.b.x, s.b.y - 0.8);
    ctx.stroke();
  }

  for (const ar of arcRegistry){
    const pulse = 7 + 4 * Math.sin(nowSec * 3 + ar.c.x * 0.02);
    ctx.save();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.arc(ar.c.x, ar.c.y, ar.R, ar.a0, ar.a1);
    ctx.stroke();
    ctx.strokeStyle = modeAccent;
    ctx.shadowColor = modeAccent;
    ctx.shadowBlur = pulse;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(ar.c.x, ar.c.y, ar.R, ar.a0, ar.a1);
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function drawTopLanes(modeAccent){
  const lanes = topLaneList;
  if (!lanes.length) return;
  const theme = getActiveTheme();
  const p = theme.palette;
  const litColor = modeAccent || p.bumperGlow;
  const xStart = 10, xEnd = 355, yTop = 24, yBot = 50;
  const laneW = (xEnd - xStart) / lanes.length;

  ctx.save();
  for (let i = 0; i < lanes.length; i++){
    const lane = lanes[i];
    const lx = xStart + i * laneW;
    const cx = lx + laneW / 2;

    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(lx, yTop); ctx.lineTo(lx, yBot); ctx.stroke();
    ctx.strokeStyle = 'rgba(240,246,252,0.9)';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(lx, yTop); ctx.lineTo(lx, yBot); ctx.stroke();

    const lit = lane.lit;
    const r = Math.min(11, laneW / 2 - 3);
    ctx.beginPath();
    ctx.arc(cx, 37, r + 2.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, 37, r, 0, Math.PI * 2);
    if (lit){
      const g = ctx.createRadialGradient(cx - r * 0.3, 33, 1, cx, 37, r);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.55, litColor);
      g.addColorStop(1, withAlpha(litColor, 0.55));
      ctx.fillStyle = g;
      ctx.shadowColor = litColor;
      ctx.shadowBlur = 14;
    } else {
      ctx.fillStyle = withAlpha(p.insertOff, 0.9);
    }
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = lit ? withAlpha(litColor, 0.95) : 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    const labelText = lane.label != null ? lane.label : String(i + 1);
    ctx.font = `7px ${FONT_PIXEL}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = lit ? '#1a0d05' : withAlpha(p.textPrimary, 0.85);
    ctx.fillText(labelText, cx, 37.5);
  }

  const lastX = xStart + lanes.length * laneW;
  ctx.strokeStyle = 'rgba(240,246,252,0.85)';
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(lastX, yTop); ctx.lineTo(lastX, yBot); ctx.stroke();
  ctx.restore();
}

function drawBumpers(nowSec, theme, modeAccent, superBumpers){
  const p = theme.palette;
  const mode = getActiveMode();
  for (const bp of bumperList){
    const drawR = (mode.id === 'bumper-frenzy' && !bp.flash)
      ? bp.r * (1 + 0.07 * Math.sin(nowSec * 5 + bp.c.x * 0.03))
      : bp.r;
    const lit = bp.flash > 0;
    const x = bp.c.x, y = bp.c.y;

    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.ellipse(x + 2, y + 5, drawR + 3, drawR * 0.9, 0, 0, Math.PI * 2);
    ctx.fill();

    if (lit){
      const t = 1 - (bp.flash / 0.45);
      ctx.globalAlpha = Math.max(0, 1 - t);
      ctx.strokeStyle = '#fff3c4';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(x, y, drawR + t * 24, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    if (superBumpers){
      const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 120 + x * 0.02);
      ctx.globalAlpha = 0.2 + pulse * 0.25;
      ctx.strokeStyle = p.insertOn;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, drawR + 8 + pulse * 8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    const chrome = ctx.createLinearGradient(x - drawR, y - drawR, x + drawR, y + drawR);
    chrome.addColorStop(0, '#fffdf4');
    chrome.addColorStop(0.25, '#cbd5df');
    chrome.addColorStop(0.5, '#78838f');
    chrome.addColorStop(0.75, '#eef4fa');
    chrome.addColorStop(1, '#6b7580');
    ctx.beginPath();
    ctx.arc(x, y, drawR + 3, 0, Math.PI * 2);
    ctx.lineWidth = 4.5;
    ctx.strokeStyle = chrome;
    ctx.stroke();

    const skirt = ctx.createRadialGradient(x - drawR * 0.35, y - drawR * 0.4, drawR * 0.15, x, y, drawR);
    skirt.addColorStop(0, lit ? '#ffffff' : '#ffe4a8');
    skirt.addColorStop(0.35, lit ? '#ffe9b5' : modeAccent);
    skirt.addColorStop(0.85, lit ? modeAccent : withAlpha(modeAccent, 0.55));
    skirt.addColorStop(1, withAlpha('#000000', 0.55));
    ctx.beginPath();
    ctx.arc(x, y, drawR, 0, Math.PI * 2);
    ctx.fillStyle = skirt;
    if (lit || superBumpers){
      ctx.shadowColor = modeAccent;
      ctx.shadowBlur = 18;
    }
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.arc(x, y, drawR * 0.72, 0, Math.PI * 2);
    ctx.fillStyle = lit ? 'rgba(255,255,255,0.85)' : withAlpha('#1a0d06', 0.32);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y, drawR * 0.62, 0, Math.PI * 2);
    ctx.strokeStyle = lit ? 'rgba(255,255,255,0.9)' : withAlpha('#fff6d8', 0.45);
    ctx.lineWidth = 1.4;
    ctx.stroke();

    drawStar(ctx, x, y - drawR * 0.12, drawR * 0.42, drawR * 0.17, withAlpha('#2a1408', lit ? 0.16 : 0.38));

    ctx.font = `bold ${Math.max(8, Math.round(drawR * 0.5))}px ${FONT_UI}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#2a1408';
    ctx.fillText(String(bp.hits), x, y + 1);
    ctx.restore();

    bp.flash = Math.max(0, bp.flash - 1 / 60);
  }
}

function drawSlings(theme){
  const p = theme.palette;
  for (const sl of slingList){
    const sign = sl.a.x < CONFIG.W / 2 ? 1 : -1;
    const c = { x: sl.a.x + sign * 13, y: sl.b.y };
    ctx.save();

    ctx.beginPath();
    ctx.moveTo(sl.a.x, sl.a.y);
    ctx.lineTo(sl.b.x, sl.b.y);
    ctx.lineTo(c.x, c.y);
    ctx.closePath();
    const body = ctx.createLinearGradient(sl.a.x, sl.a.y, c.x, c.y);
    body.addColorStop(0, withAlpha(p.slingGlow, 0.32));
    body.addColorStop(1, withAlpha('#000000', 0.28));
    ctx.fillStyle = body;
    ctx.fill();
    ctx.strokeStyle = withAlpha(p.slingGlow, 0.35);
    ctx.lineWidth = 1;
    ctx.stroke();

    for (const post of [sl.a, sl.b, c]){
      const pg = ctx.createRadialGradient(post.x - 2, post.y - 2, 0.5, post.x, post.y, 5);
      pg.addColorStop(0, '#fffdf4');
      pg.addColorStop(0.5, '#aab4bf');
      pg.addColorStop(1, '#3a4048');
      ctx.beginPath();
      ctx.arc(post.x, post.y, 4.2, 0, Math.PI * 2);
      ctx.fillStyle = pg;
      ctx.fill();
    }

    const hot = sl.flash > 0;
    ctx.strokeStyle = hot ? '#ffffff' : p.slingGlow;
    ctx.lineWidth = 6.5;
    ctx.lineCap = 'round';
    if (hot){
      ctx.shadowColor = p.slingGlow;
      ctx.shadowBlur = 18;
    }
    ctx.beginPath();
    ctx.moveTo(sl.a.x, sl.a.y);
    ctx.lineTo(sl.b.x, sl.b.y);
    ctx.stroke();
    ctx.shadowBlur = 0;

    for (const t of [0.32, 0.68]){
      const bx = sl.a.x + (sl.b.x - sl.a.x) * t;
      const by = sl.a.y + (sl.b.y - sl.a.y) * t;
      ctx.beginPath();
      ctx.arc(bx, by, 2.6, 0, Math.PI * 2);
      ctx.fillStyle = hot ? '#fffbe8' : withAlpha(p.slingGlow, 0.9);
      ctx.fill();
    }
    ctx.restore();
    sl.flash = Math.max(0, sl.flash - 1 / 60);
  }
}

function drawDrops(theme, modeAccent){
  for (const dp of dropList){
    const x = dp.c.x - dp.w / 2;
    const y = dp.c.y - dp.h / 2;
    if (dp.down){
      roundRectPath(ctx, x, y + 3, dp.w, dp.h, 2);
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.07)';
      ctx.lineWidth = 1;
      ctx.stroke();
      continue;
    }
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    roundRectPath(ctx, x + 1, y + 3, dp.w, dp.h, 2);
    ctx.fill();

    const g = ctx.createLinearGradient(0, y, 0, y + dp.h);
    g.addColorStop(0, '#fff8d8');
    g.addColorStop(0.18, modeAccent);
    g.addColorStop(1, withAlpha(modeAccent, 0.55));
    roundRectPath(ctx, x, y, dp.w, dp.h, 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + 2, y + 1.5);
    ctx.lineTo(x + dp.w - 2, y + 1.5);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(30,12,4,0.34)';
    ctx.lineWidth = 2;
    const stripeGap = Math.max(7, dp.w / 4);
    for (let sx = x + stripeGap; sx < x + dp.w; sx += stripeGap){
      ctx.beginPath();
      ctx.moveTo(sx, y + 2);
      ctx.lineTo(sx - 4, y + dp.h - 2);
      ctx.stroke();
    }

    ctx.font = `bold ${Math.max(6, Math.min(9, dp.h - 3))}px ${FONT_UI}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(30,12,4,0.75)';
    ctx.fillText('DROP', dp.c.x, dp.c.y + 0.5);
    ctx.restore();
  }
}

function drawFlippers(theme){
  const p = theme.palette;
  const list = [flippers.miniL, flippers.L, flippers.R].filter(Boolean);
  for (const f of list){
    const tip = flipperTip(f);
    const mini = f === flippers.miniL;
    const w = mini ? 9 : 14;
    ctx.save();
    ctx.lineCap = 'round';

    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = w + 5;
    ctx.beginPath();
    ctx.moveTo(f.pivot.x + 2, f.pivot.y + 3);
    ctx.lineTo(tip.x + 2, tip.y + 3);
    ctx.stroke();

    ctx.strokeStyle = p.slingGlow;
    ctx.lineWidth = w + 4.5;
    if (f.pressed){
      ctx.shadowColor = p.slingGlow;
      ctx.shadowBlur = 14;
    }
    ctx.beginPath();
    ctx.moveTo(f.pivot.x, f.pivot.y);
    ctx.lineTo(tip.x, tip.y);
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = '#f7edd4';
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(f.pivot.x, f.pivot.y);
    ctx.lineTo(tip.x, tip.y);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = Math.max(1.5, w * 0.28);
    ctx.beginPath();
    ctx.moveTo(f.pivot.x, f.pivot.y - w * 0.2);
    ctx.lineTo(tip.x, tip.y - w * 0.2);
    ctx.stroke();

    const radius = mini ? 6 : 9;
    const pg = ctx.createRadialGradient(f.pivot.x - 2, f.pivot.y - 2, 1, f.pivot.x, f.pivot.y, radius);
    pg.addColorStop(0, '#fffdf4');
    pg.addColorStop(0.5, '#c9d2dc');
    pg.addColorStop(1, '#4d555e');
    ctx.beginPath();
    ctx.arc(f.pivot.x, f.pivot.y, radius, 0, Math.PI * 2);
    ctx.fillStyle = pg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
}

function drawPlunger(nowSec, theme){
  const p = theme.palette;
  const charge = plunger.charge;
  const x = 400;
  ctx.save();
  ctx.lineCap = 'round';

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(384, 666, 32, 44);

  const top = 680, bottom = 710, coils = 8;
  ctx.strokeStyle = '#b9c5d1';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  for (let i = 0; i <= coils; i++){
    const t = i / coils;
    const y = top + (bottom - top) * t;
    const xo = (i % 2 === 0 ? -5 : 5) * (1 - charge * 0.35);
    if (i === 0) ctx.moveTo(x + xo, y); else ctx.lineTo(x + xo, y);
  }
  ctx.stroke();

  ctx.strokeStyle = '#8d99a6';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x, 674);
  ctx.lineTo(x, 708);
  ctx.stroke();

  const ky = 712 + charge * 3;
  const kg = ctx.createRadialGradient(x - 2, ky - 2, 1, x, ky, 8);
  kg.addColorStop(0, '#ffd9c4');
  kg.addColorStop(0.5, p.slingGlow);
  kg.addColorStop(1, withAlpha('#2a0a04', 0.9));
  ctx.beginPath();
  ctx.arc(x, ky, 7, 0, Math.PI * 2);
  ctx.fillStyle = kg;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 1;
  ctx.stroke();

  if (state.phase === 'ready'){
    const blink = 0.55 + 0.45 * Math.sin(nowSec * 6);
    ctx.globalAlpha = blink;
    ctx.fillStyle = p.insertOn;
    ctx.font = `6px ${FONT_PIXEL}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('PULL', x, 652);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawKickbackLamps(nowSec, theme){
  const p = theme.palette;
  const lamps = [
    { x: 48, y: 470, on: state.kickback },
    { x: 372, y: 470, on: state.rightKickback },
  ];
  for (const l of lamps){
    ctx.save();
    ctx.beginPath();
    ctx.arc(l.x, l.y, 9, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fill();
    ctx.strokeStyle = withAlpha(p.bumperGlow, l.on ? 0.85 : 0.25);
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(l.x, l.y, 5.5, 0, Math.PI * 2);
    if (l.on){
      ctx.fillStyle = p.bumperGlow;
      ctx.shadowColor = p.bumperGlow;
      ctx.shadowBlur = 10;
    } else {
      ctx.fillStyle = withAlpha(p.insertOff, 0.9);
    }
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.font = `5px ${FONT_PIXEL}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = l.on ? '#2a1408' : withAlpha(p.textPrimary, 0.55);
    ctx.fillText('K', l.x, l.y + 0.5);
    ctx.fillStyle = withAlpha(p.textPrimary, 0.55);
    ctx.fillText('SAVE', l.x, l.y + 16);

    ctx.save();
    ctx.globalAlpha = 0.55 + 0.35 * Math.sin(nowSec * 5);
    ctx.font = `6px ${FONT_PIXEL}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#86ef9c';
    ctx.fillText('BALL SAVER', CONFIG.W / 2, 688);

}

function drawDrain(theme){
  const y = CONFIG.H - 17;
  ctx.save();
  ctx.beginPath();

  ctx.lineTo(DRAIN_RIGHT - 6, y);

function drawBall(theme){
  const p = theme.palette;
  const x = ball.p.x, y = ball.p.y, r = ball.r;

  for (let i = 0; i < trail.length; i++){
    const t = trail[i];
    const a = i / trail.length;
    ctx.beginPath();
    ctx.arc(t.x, t.y, r * a * 0.85, 0, Math.PI * 2);
    ctx.fillStyle = withAlpha(p.bumperGlow, a * 0.18);
    ctx.fill();
  }

  ctx.save();
  ctx.globalAlpha = 0.32;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(x + 1.5, y + 5, r * 0.95, r * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  const g = ctx.createRadialGradient(x - r * 0.42, y - r * 0.48, r * 0.1, x, y, r);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.35, '#e3ebf3');
  g.addColorStop(0.75, '#9aa8b6');
  g.addColorStop(1, '#525d68');
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(x - r * 0.35, y - r * 0.4, r * 0.24, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x + r * 0.3, y + r * 0.45, r * 0.18, 0, Math.PI * 2);
  ctx.fillStyle = withAlpha(p.bumperGlow, 0.25);
  ctx.fill();
}

function drawParticles(){
  for (const pt of particles){
    ctx.globalAlpha = Math.max(0, pt.life * 2);
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloatTexts(dtRender){
  for (let i = floatTexts.length - 1; i >= 0; i--){
    const ft = floatTexts[i];
    ft.x += ft.vx * dtRender;
    ft.y += ft.vy * dtRender;
    ft.life -= dtRender;
    if (ft.life <= 0){
      floatTexts.splice(i, 1);
      continue;
    }
    const fa = Math.min(1, ft.life / (ft.maxLife * 0.35));
    ctx.save();
    ctx.globalAlpha = fa;
    ctx.shadowColor = ft.color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = ft.color;
    ctx.font = `9px ${FONT_PIXEL}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
  }
}

function drawSuperBanner(nowSec, palette){
  if (!bumperSuperActive(nowSec)) return;

  ctx.globalAlpha = pulse;

  ctx.strokeStyle = palette.insertOn;
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.font = `7px ${FONT_PIXEL}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = palette.insertOn;
  ctx.shadowColor = palette.insertOn;
  ctx.shadowBlur = 10;

}

function drawBackglassDynamic(nowSec, theme, superBumpers){

  const BX = CONFIG.BACK_X, BY = CONFIG.BACK_Y;
  const dy = BY + 100;
  const c = ctx;

  c.save();
  c.textBaseline = 'alphabetic';
  c.textAlign = 'left';
  c.font = `7px ${FONT_PIXEL}`;
  c.fillStyle = withAlpha(p.textAccent, 0.95);
  c.fillText('SCORE', BX + 18, dy + 14);
  drawSeg7Number(c, BX + 18, dy + 21, 15, 29, 4, state.score, 7, p.displayOn, p.displayOff, 9);

  c.fillStyle = withAlpha(p.textAccent, 0.95);
  c.fillText('BALL', BX + 164, dy + 14);
  drawSeg7Number(c, BX + 164, dy + 21, 15, 29, 4, state.balls, 1, p.displayOn, p.displayOff, 8);

  c.fillStyle = withAlpha(p.textAccent, 0.95);
  c.fillText('MULT', BX + 202, dy + 14);
  drawSeg7Number(c, BX + 202, dy + 21, 15, 29, 4, state.mult, 1, p.displayOn, p.displayOff, 8);

  const ix = BX + 244;
  c.font = `7px ${FONT_PIXEL}`;
  c.fillStyle = withAlpha(p.textPrimary, 0.62);
  c.fillText('BEST ' + String(Math.min(9999999, state.hi)).padStart(7, '0'), ix, dy + 16);
  c.fillStyle = cab.trim;
  c.fillText(theme.name.toUpperCase(), ix, dy + 32);

  c.restore();
}

function drawRailBulbs(nowSec, theme){
  const p = theme.palette;
  const cab = theme.cabinet;
  const step = Math.floor(nowSec * 6);
  for (const x of [54, VIEW.W - 54]){
    for (let i = 0; i < 16; i++){
      const y = 248 + i * 42;
      const on = (i + step + (x > 270 ? 2 : 0)) % 4 === 0;
      ctx.beginPath();
      ctx.arc(x, y, 3, 0, Math.PI * 2);
      ctx.fillStyle = on ? p.insertOn : withAlpha(cab.trim, 0.22);
      if (on){
        ctx.shadowColor = p.insertOn;
        ctx.shadowBlur = 8;
      }
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
}

function drawCabinetButtons(theme){
  const p = theme.palette;
  const cab = theme.cabinet;
  const buttons = [
    { x: 34, y: 806, pressed: input.L, label: 'L' },
    { x: VIEW.W - 34, y: 806, pressed: input.R, label: 'R' },
  ];
  for (const b of buttons){
    ctx.save();
    const ring = ctx.createLinearGradient(b.x - 15, b.y - 15, b.x + 15, b.y + 15);
    ring.addColorStop(0, '#fff9ea');
    ring.addColorStop(0.4, cab.chrome);
    ring.addColorStop(0.7, '#7d725f');
    ring.addColorStop(1, cab.trimDark);
    ctx.beginPath();
    ctx.arc(b.x, b.y, 15, 0, Math.PI * 2);
    ctx.fillStyle = '#160c07';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = ring;
    ctx.stroke();

    const face = ctx.createRadialGradient(b.x - 4, b.y - 5, 1, b.x, b.y, 11);
    face.addColorStop(0, b.pressed ? '#ffffff' : '#ffd9a1');
    face.addColorStop(0.5, p.slingGlow);
    face.addColorStop(1, withAlpha(p.slingGlow, 0.45));
    ctx.beginPath();
    ctx.arc(b.x, b.y + (b.pressed ? 1 : 0), 9.5, 0, Math.PI * 2);
    ctx.fillStyle = face;
    if (b.pressed){
      ctx.shadowColor = p.slingGlow;
      ctx.shadowBlur = 16;
    }
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.font = `6px ${FONT_PIXEL}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(30,12,6,0.8)';
    ctx.fillText(b.label, b.x, b.y + 1);
    ctx.restore();
  }
}

function drawGameOver(nowSec, theme){

  g.addColorStop(1, 'rgba(8,3,2,0.98)');

  c.shadowColor = 'rgba(0,0,0,0.8)';
  c.shadowBlur = 30;
  roundRectPath(c, x, y, w, h, 12);
  c.fillStyle = g;
  c.fill();

  c.strokeStyle = cab.trim;
  c.shadowColor = cab.trim;
  c.shadowBlur = 16;

  c.stroke();
  c.shadowBlur = 0;
  roundRectPath(c, x + 6, y + 6, w - 12, h - 12, 8);
  c.lineWidth = 1;
  c.strokeStyle = 'rgba(255,255,255,0.12)';
  c.stroke();

  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.font = `18px ${FONT_PIXEL}`;
  c.fillStyle = p.textAccent;
  c.shadowColor = p.textAccent;
  c.shadowBlur = 14;
  c.fillText('GAME OVER', VIEW.W / 2, y + 42);

  c.font = `7px ${FONT_PIXEL}`;
  c.fillStyle = withAlpha(p.textPrimary, 0.7);
  c.fillText('FINAL SCORE', VIEW.W / 2, y + 66);
  drawSeg7Number(c, VIEW.W / 2 - 78, y + 76, 18, 32, 5, state.score, 7, p.displayOn, p.displayOff, 10);

  c.font = `7px ${FONT_PIXEL}`;
  c.fillStyle = withAlpha(p.textPrimary, 0.55);
  c.fillText('BEST ' + String(Math.min(9999999, state.hi)).padStart(7, '0'), VIEW.W / 2, y + 128);

function menuSection(c, y, text, color, x, xEnd){
  c.font = `8px ${FONT_PIXEL}`;
  c.textAlign = 'left';
  c.textBaseline = 'middle';
  c.fillStyle = color;
  c.fillText(text, x, y);
  const tw = c.measureText(text).width;
  c.strokeStyle = withAlpha(color, 0.28);
  c.lineWidth = 1;
  c.beginPath();
  c.moveTo(x + tw + 10, y);
  c.lineTo(xEnd, y);
  c.stroke();
}

function drawMenuRow(c, x, y, w, h, key, label, selected, theme, swatch, accent){
  const p = theme.palette;
  const col = accent || p.textAccent;

  if (selected){
    roundRectPath(c, x, y, w, h, 5);
    c.fillStyle = withAlpha(col, 0.14);
    c.fill();
    c.strokeStyle = withAlpha(col, 0.5);
    c.lineWidth = 1;
    c.stroke();
    c.fillStyle = col;
    c.fillRect(x + 1, y + 4, 3, h - 8);
  }

  roundRectPath(c, x + 10, y + h / 2 - 8, 18, 16, 3);
  c.fillStyle = selected ? col : 'rgba(255,255,255,0.06)';
  c.fill();
  c.strokeStyle = selected ? col : 'rgba(255,255,255,0.18)';
  c.lineWidth = 1;
  c.stroke();

  c.font = `8px ${FONT_PIXEL}`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillStyle = selected ? '#1a0d06' : withAlpha(p.textPrimary, 0.8);
  c.fillText(key, x + 19, y + h / 2 + 1);

  c.textAlign = 'left';
  c.fillStyle = selected ? col : withAlpha(p.textPrimary, 0.8);
  c.fillText(label, x + 38, y + h / 2 + 1);

  if (swatch){
    c.beginPath();
    c.arc(x + w - 46, y + h / 2, 5.5, 0, Math.PI * 2);
    c.fillStyle = swatch.fill;
    c.fill();
    c.strokeStyle = swatch.stroke;
    c.lineWidth = 1.5;
    c.stroke();
  }

  if (selected){
    c.beginPath();
    c.arc(x + w - 22, y + h / 2, 5, 0, Math.PI * 2);
    c.fillStyle = col;
    c.fill();
    c.strokeStyle = 'rgba(20,10,4,0.9)';
    c.lineWidth = 1.4;
    c.beginPath();
    c.moveTo(x + w - 24.5, y + h / 2);
    c.lineTo(x + w - 22.5, y + h / 2 + 2);
    c.lineTo(x + w - 19.5, y + h / 2 - 2);
    c.stroke();
  }
}

  c.font = `8px ${FONT_PIXEL}`;
  c.fillStyle = accent;
  c.fillText('ENTER  APPLY + RESUME', W / 2, PY + 458);

  c.fillText('ESC  CANCEL + RESUME', W / 2, PY + 476);

function render(){
  const dtRender = 1 / 60;
  const nowSec = performance.now() / 1000;
  const theme = getActiveTheme();
  const palette = theme.palette;
  const mode = getActiveMode();
  const modeAccent = mode.accentColor || palette.bumperGlow;
  const superBumpers = bumperSuperActive(nowSec);

  updateLightEffects(dtRender);
  trail.push({ x: ball.p.x, y: ball.p.y });
  if (trail.length > 14) trail.shift();

  for (let i = particles.length - 1; i >= 0; i--){
    const pt = particles[i];
    pt.vy += 200 * dtRender;
    pt.x += pt.vx * dtRender;
    pt.y += pt.vy * dtRender;
    pt.life -= dtRender;
    if (pt.life <= 0) particles.splice(i, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dtRender * 30);

  ensureArtLayers();

  const sx = shake > 0 ? (Math.random() - 0.5) * shake : 0;
  const sy = shake > 0 ? (Math.random() - 0.5) * shake : 0;

  ctx.save();
  ctx.clearRect(0, 0, VIEW.W, VIEW.H);
  ctx.drawImage(backdropCanvas, 0, 0);

  ctx.save();
  roundRectPath(ctx, VIEW.PX, VIEW.PY, VIEW.PW, VIEW.PH, 4);
  ctx.clip();
  ctx.translate(VIEW.PX + sx, VIEW.PY + sy);
  ctx.drawImage(playfieldArtCanvas, 0, 0);

  drawPlayfieldBulbs(nowSec, palette);
  drawWalls(nowSec, theme, modeAccent);
  drawTopLanes(modeAccent);
  drawDrain(theme);
  drawSlings(theme);
  drawDrops(theme, modeAccent);
  drawBumpers(nowSec, theme, modeAccent, superBumpers);
  drawFlippers(theme);
  drawPlunger(nowSec, theme);
  drawKickbackLamps(nowSec, theme);
  drawBall(theme);
  drawParticles();
  renderLightEffects();
  drawFloatTexts(dtRender);
  drawSuperBanner(nowSec, palette);
  ctx.restore();

  drawBackglassDynamic(nowSec, theme, superBumpers);
  drawRailBulbs(nowSec, theme);
  drawCabinetButtons(theme);
  drawApronText(theme);
  if (state.phase === 'gameover') drawGameOver(nowSec, theme);
  renderMenuOverlay();
  ctx.restore();
}

// ============ 10. LOOP ============
let paused = false;
let last = performance.now();
let acc = 0;
function frame(now){
  const dt = Math.min(0.1, (now - last)/1000);
  last = now;
  if (!paused){
    acc += dt;
    let steps = 0;
    while (acc >= CONFIG.FIXED_DT && steps < CONFIG.MAX_SUBSTEPS){
      physicsStep(CONFIG.FIXED_DT);
      acc -= CONFIG.FIXED_DT;
      steps++;
    }
    if (acc > CONFIG.MAX_SUBSTEPS * CONFIG.FIXED_DT) acc = 0;
    plungerStep(dt);
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ============ 11. TEST HOOK ============
const emitThemeEvent = dispatchThemeEvent;
window.__test = {
  get ball(){ return ball; },
  get state(){ return state; },
  get segments(){ return segments; },
  get bumpers(){ return bumperList; },
  get topLanes(){ return topLaneList; },
  get drops(){ return dropList; },
  CONFIG,
  step(n=1){ for(let i=0;i<n*CONFIG.MAX_SUBSTEPS;i++) physicsStep(CONFIG.FIXED_DT); render(); },
  pause(){ paused = true; },
  resume(){ paused = false; },
  place(x,y,vx=0,vy=0){ ball.p={x,y}; ball.v={x:vx,y:vy}; },
  press(key){ const e = new KeyboardEvent('keydown',{key}); window.dispatchEvent(e); },
  release(key){ const e = new KeyboardEvent('keyup',{key}); window.dispatchEvent(e); },
  _math: { sweepCircleSegment, sweepCircleEnd, sweepCircleArc },
  _addTempFloor(x1,y1,x2,y2){ addSegment({x:x1,y:y1},{x:x2,y:y2}); },
  plungerCharge(amount){ plunger.charge = clamp(amount, 0, 1); },
  plungerRelease(){ plungerRelease(); },
  restart(){ restartGame(); },
  openMenu(){ openMenu(); },
  closeMenuAndResume(){ closeMenuAndResume(); },
  isMenuOpen(){ return menu.open; },
  getCabinetMenuHint(){ return getCabinetMenuIndicatorText(); },
  getCabinetMenuControls(){ return getCabinetMenuControlLines(); },
  getCabinetMenuRules(){ return getCabinetMenuRuleLines(); },
  setThemeFromMenu(id){ return applyThemeFromMenu(id); },
  setSoundFromMenu(enabled){ return applySoundFromMenu(enabled); },
  getThemeId(){ return settings.themeId; },
  isSoundEnabled(){ return settings.soundEnabled; },
  getGameplayModeId(){ return settings.gameplayModeId; },
  setGameplayModeFromMenu(id){ return applyGameplayModeFromMenu(id); },
  get miniLFlipper(){ return flippers.miniL; },
  addScore(points){ applyScore(points); },
  forcePhase(phase){ state.phase = phase; },
  dispatchThemeEvent(type, payload){ emitThemeEvent(type, payload); },
  getActiveLightEffectCount(){ return lightEffects.length; },
  getAudioPlayCount(){ return audioPlayCount; },
};
